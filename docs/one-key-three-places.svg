<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="title desc">
  <title id="title">One key, three places</title>
  <desc id="desc">One OpenAI key ending in a91f is stored in a Railway service, a GitHub Actions secret and a committed .env.local file. In the last hour it spent $41; a normal day is about $3.</desc>
  <style>
    .bg     { fill: #ffffff; stroke: #d0d7de; }
    .box    { fill: #f6f8fa; stroke: #d0d7de; }
    .key    { fill: #ddf4ff; stroke: #0969da; }
    .alert  { fill: #ffebe9; stroke: #cf222e; }
    .line   { stroke: #8c959f; fill: none; }
    .hot    { stroke: #cf222e; fill: none; }
    .t      { fill: #1f2328; }
    .m      { fill: #59636e; }
    .k      { fill: #0969da; }
    .r      { fill: #cf222e; }
    text    { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; stroke: #30363d; }
      .box   { fill: #161b22; stroke: #30363d; }
      .key   { fill: #0c2d6b; stroke: #4493f8; }
      .alert { fill: #3c1618; stroke: #f85149; }
      .line  { stroke: #6e7681; }
      .hot   { stroke: #f85149; }
      .t     { fill: #e6edf3; }
      .m     { fill: #9198a1; }
      .k     { fill: #79c0ff; }
      .r     { fill: #ff7b72; }
    }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="799" height="399" rx="12"/>

  <text class="t" x="32" y="44" font-size="20" font-weight="600">One key, three places</text>
  <text class="m" x="32" y="68" font-size="13">What keywatch found for the OpenAI key behind support-bot</text>

  <!-- links from places to the key -->
  <path class="line" stroke-width="2" d="M262 133 C 300 133, 300 230, 330 230"/>
  <path class="line" stroke-width="2" d="M262 233 L 330 233"/>
  <path class="line" stroke-width="2" d="M262 333 C 300 333, 300 236, 330 236"/>
  <!-- link from key to spend -->
  <path class="hot" stroke-width="2" stroke-dasharray="6 5" d="M510 233 L 552 233"/>

  <!-- places -->
  <rect class="box" x="32" y="104" width="230" height="58" rx="8"/>
  <text class="t" x="48" y="128" font-size="14" font-weight="600">Railway</text>
  <text class="m mono" x="48" y="148" font-size="12">support-bot · production</text>

  <rect class="box" x="32" y="204" width="230" height="58" rx="8"/>
  <text class="t" x="48" y="228" font-size="14" font-weight="600">GitHub Actions secret</text>
  <text class="m mono" x="48" y="248" font-size="12">OPENAI_API_KEY (by name)</text>

  <rect class="box" x="32" y="304" width="230" height="58" rx="8"/>
  <text class="t" x="48" y="328" font-size="14" font-weight="600">.env.local</text>
  <text class="r" x="48" y="348" font-size="12">committed to git</text>

  <!-- the key -->
  <rect class="key" x="330" y="196" width="180" height="74" rx="10" stroke-width="2"/>
  <text class="k mono" x="420" y="229" font-size="20" font-weight="600" text-anchor="middle">sk-…a91f</text>
  <text class="m" x="420" y="252" font-size="12" text-anchor="middle">one OpenAI key</text>

  <!-- spend callout -->
  <rect class="alert" x="552" y="180" width="216" height="106" rx="10" stroke-width="2"/>
  <text class="m" x="572" y="206" font-size="12">Spend in the last hour</text>
  <text class="r" x="572" y="242" font-size="30" font-weight="700">$41/hr</text>
  <text class="t" x="572" y="268" font-size="13">vs $3/day normal</text>
</svg>
